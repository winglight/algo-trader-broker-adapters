[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trader-broker-adapter-ccxt-crypto"
version = "0.1.0"
description = "OKX Demo Spot adapter for the algo-trader Broker SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "algo-trader-broker-sdk>=1,<2",
  "algo-trader-ccxt-crypto-perpetual-internal==0.1.0",
  "ccxt==4.5.56",
]

[project.entry-points."algo_trader.broker_adapters"]
ccxt_crypto = "algo_trader_broker_adapter_ccxt_crypto:create_adapter"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
algo_trader_broker_adapter_ccxt_crypto = ["py.typed"]
