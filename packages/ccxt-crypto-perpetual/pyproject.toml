[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trader-ccxt-crypto-perpetual-internal"
version = "0.1.0"
description = "Internal OKX perpetual context for the unified CCXT crypto adapter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "algo-trader-broker-sdk>=1,<2",
  "ccxt==4.5.56",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
algo_trader_broker_adapter_ccxt_crypto_perpetual = ["py.typed"]
